syntax = "proto3";

package refund.v1;

option go_package = "github.com/hughtaiyaki/goframeshop/app/order/api/refund/v1";

import "google/protobuf/timestamp.proto";

// RefundService handles after-sale requests. A shopper may ask only about a
// paid order of their own, and only for goods in it; the user id always comes
// from the token. The amount is the goods line's subtotal, set by the server.
//
// An administrator approves (the money for that line is paid back through
// the payment provider) or rejects with a reason.
service RefundService {
  rpc CreateRefund(CreateRefundRequest) returns (RefundResponse);
  rpc ListMyRefunds(ListMyRefundsRequest) returns (ListRefundsResponse);
  rpc GetMyRefund(GetMyRefundRequest) returns (RefundResponse);
  rpc ListRefunds(ListRefundsRequest) returns (ListRefundsResponse);
  // ApproveRefund moves PENDING to APPROVED and pays the amount back; it is
  // REFUNDED once the provider confirms (retried by the worker until then).
  // Approving an approved or refunded request returns it unchanged.
  rpc ApproveRefund(ApproveRefundRequest) returns (RefundResponse);
  // RejectRefund moves PENDING to REJECTED with a reason.
  rpc RejectRefund(RejectRefundRequest) returns (RefundResponse);
}

enum RefundStatus {
  REFUND_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  APPROVED = 2;   // approved; the money is being paid back
  REJECTED = 3;
  REFUNDED = 4;   // the money is back
}

message CreateRefundRequest {
  // v:required|length:1,32
  string order_no = 1;
  // v:min:1
  uint64 goods_id = 2;
  // v:required|length:1,255
  string reason = 3;
}

message ListMyRefundsRequest {
  // v:min:1
  uint32 page = 1;
  // v:between:1,50
  uint32 size = 2;
}

message GetMyRefundRequest {
  // v:required|length:1,32
  string refund_no = 1;
}

message ListRefundsRequest {
  RefundStatus status = 1;
  // v:min:1
  uint32 page = 2;
  // v:between:1,50
  uint32 size = 3;
}

message ApproveRefundRequest {
  // v:required|length:1,32
  string refund_no = 1;
  // v:length:0,255
  string note = 2;
}

message RejectRefundRequest {
  // v:required|length:1,32
  string refund_no = 1;
  // Shown to the shopper.
  // v:required|length:1,255
  string note = 2;
}

message RefundResponse {
  Refund refund = 1;
}

message ListRefundsResponse {
  repeated Refund items = 1;
  uint32 page = 2;
  uint32 size = 3;
  uint64 total = 4;
}

message Refund {
  string refund_no = 1;
  string order_no = 2;
  uint64 user_id = 3;
  uint64 goods_id = 4;
  string reason = 5;
  RefundStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  // The goods line's subtotal: what is paid back when approved.
  uint64 amount_cents = 8;
  string goods_name = 9;
  // The administrator's note; the reason when REJECTED.
  string review_note = 10;
  google.protobuf.Timestamp reviewed_at = 11;
  google.protobuf.Timestamp refunded_at = 12;
}
