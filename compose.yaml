name: goframeshop

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-user}
      MYSQL_USER: ${MYSQL_USER:-shop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  etcd:
    image: gcr.io/etcd-development/etcd:v3.6.1
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=goframeshop-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=goframeshop-etcd=http://0.0.0.0:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=change-me
      - --logger=zap
    ports:
      - "${ETCD_CLIENT_PORT:-2379}:2379"
      - "${ETCD_PEER_PORT:-2380}:2380"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/etcdctl
        - endpoint
        - health
      interval: 5s
      timeout: 5s
      retries: 20

  # Cache only: every value can be rebuilt from MySQL, so losing it is safe,
  # and persistence is OFF on purpose (no RDB snapshot, no AOF). A restarted
  # Redis must come back empty: restoring a snapshot would bring back entries
  # whose invalidation was missed while it was down, and serve stale data.
  # The password keeps a stray local process from reading or flushing it; like
  # the MySQL defaults it is for local development only.
  redis:
    image: redis:7.4.2
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-change-me}
      - --appendonly
      - "no"
      - --save
      - ""
    # The image declares VOLUME /data, and Compose keeps that anonymous volume
    # across container re-creation; Redis loads any dump.rdb it finds there at
    # startup even with saving disabled. tmpfs makes /data vanish with the
    # container, so no old snapshot can ever be restored.
    tmpfs:
      - /data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me}

  # Search index for the goods catalogue. It is a projection of MySQL rebuilt
  # by the search service on every start, so its data is disposable too.
  # Security is off for local development only: no TLS, no login.
  elasticsearch:
    build: ./deploy/elasticsearch
    image: goframeshop/elasticsearch-ik:8.11.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fs http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Message broker for domain events (Outbox → RabbitMQ → Inbox). Messages
  # are a delivery mechanism, never the only record: every event is first
  # written to its service's outbox table in MySQL, so losing the broker's
  # data loses nothing that cannot be re-sent. The volume still keeps durable
  # queues and persistent messages across restarts, like a real broker.
  # The node name depends on the hostname, so it is fixed. Management UI on
  # :15672 with the same local-only credentials.
  rabbitmq:
    image: rabbitmq:4.2.0-management
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-shop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Tracing (design §9): services → OTel Collector (:4317) → Jaeger (UI :16686).
  # Jaeger keeps traces in memory only: a restart forgets them, which is fine
  # for a lab. Neither has any login; local development only.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

  # Optional UI for the index: `docker compose --profile tools up -d kibana`.
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    profiles: ["tools"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      I18N_LOCALE: zh-CN
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  mysql-data:
  etcd-data:
  es-data:
  rabbitmq-data:
