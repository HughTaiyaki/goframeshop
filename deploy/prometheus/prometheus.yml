# Prometheus (task 0020): scrapes the metrics the OTel Collector exposes on
# :8889 every 5s (design §9.2) and evaluates the alert rules (design §9.3).
# Services never talk to Prometheus; they push OTLP to the collector.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: otel-collector
    # The services' own labels (service, environment) are kept as they are:
    # the collector adds none of its own.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
    # Keep only the labels of design §9.2 on the trade_ metrics: drop the
    # exporter's scope labels and the scrape's own job and instance (one
    # collector, so they carry no information).
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: trade_.*
        action: keep
      - regex: otel_scope_.*|job|instance
        action: labeldrop
